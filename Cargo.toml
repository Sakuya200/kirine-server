[package]
name = "kirine-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
axum = "0.8"
calamine = "0.34.0"
rand = "0.10.1"
sea-orm = { version = "1.1.20", features = ["macros", "sqlx-postgres", "runtime-tokio-rustls"] }
sea-orm-migration = { version = "1.1.20", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres"] }
time = { version = "0.3.47", features = ["formatting", "local-offset", "macros"] }
tokio = { version = "1", features = ["full"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
walkdir = "2.5.0"
zip = { version = "8.6.0", features = ["deflate"] }
log = "0.4.29"
thiserror = "2.0.18"
jsonwebtoken = "10.4.0"
rsa = { version = "0.9.8", features = ["pem"] }
hashbrown = "0.17.1"
sha2 = "0.10.9"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
